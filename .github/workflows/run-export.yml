name: Export Sheets to Telegram (scheduled and manual)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [report-capture-auto, report-capture-manual]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.repository.name }}-report-capture
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PDF tools (pdftoppm + ImageMagick + Ghostscript)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick ghostscript

      - name: Install dependencies
        run: npm ci

      - name: Run export script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAMES: ${{ secrets.SHEET_NAMES }}
          START_COL: ${{ secrets.START_COL }}
          END_COL: ${{ secrets.END_COL }}
          MAX_ROWS_PER_FILE: ${{ secrets.MAX_ROWS_PER_FILE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPTURE_TRIGGER: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'report-capture-auto' && 'auto' || 'manual' }}
          CAPTURE_SCHEDULE_DATE: ${{ github.event.client_payload.scheduleDate || '' }}
          CAPTURE_SCHEDULE_TIME: ${{ github.event.client_payload.scheduleTime || '' }}
          CAPTURE_TIME_ZONE: ${{ github.event.client_payload.timeZone || 'Asia/Ho_Chi_Minh' }}
          TZ: ${{ github.event.client_payload.timeZone || 'Asia/Ho_Chi_Minh' }}
        run: |
          echo "Capture trigger: $CAPTURE_TRIGGER"
          if [ -n "$CAPTURE_SCHEDULE_DATE" ] && [ -n "$CAPTURE_SCHEDULE_TIME" ]; then
            echo "Scheduled slot: $CAPTURE_SCHEDULE_DATE $CAPTURE_SCHEDULE_TIME ($CAPTURE_TIME_ZONE)"
          fi
          node index.js
